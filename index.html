<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Clima de Aplicação</title>
<style>
  :root {
    --fundo: #0f1115; --cartao: #181b22; --borda: #262a33; --texto: #e8eaf0; --fraco: #9aa1b0;
    --bom: #2e9e5b; --atencao: #d9a21b; --ruim: #d6453d; --sem: #5b6270;
    --bom-f: #163d26; --atencao-f: #4a3a0c; --ruim-f: #4a1b18; --sem-f: #262a33;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--fundo); color: var(--texto);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
  body { padding: 12px 12px calc(16px + env(safe-area-inset-bottom)); max-width: 720px; margin: 0 auto; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 4px 2px 12px; }
  header h1 { font-size: 20px; margin: 0; font-weight: 700; letter-spacing: .2px; }
  header .hora { color: var(--fraco); font-size: 13px; text-align: right; }
  header .hora b { color: var(--texto); font-weight: 600; }
  .resumo { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .pill { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--cartao); border: 1px solid var(--borda); color: var(--fraco); }
  .pill b { color: var(--texto); }
  .aviso { background: #3a2a0c; border: 1px solid #6b4e12; color: #ffd98a; padding: 8px 12px; border-radius: 10px; font-size: 13px; margin-bottom: 10px; }
  .erro { background: #4a1b18; border-color: #8a2f28; color: #ffb3ad; }

  .faz { background: var(--cartao); border: 1px solid var(--borda); border-radius: 14px; margin-bottom: 12px; overflow: hidden; }
  .faixa { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; }
  .faixa.bom { background: var(--bom); } .faixa.atencao { background: var(--atencao); color: #1a1500; }
  .faixa.ruim { background: var(--ruim); } .faixa.sem_dado { background: var(--sem); }
  .faixa .nome { font-size: 17px; font-weight: 700; }
  .faixa .rotulo { font-size: 15px; font-weight: 800; text-align: right; letter-spacing: .3px; }
  .faixa small { display: block; font-weight: 500; font-size: 12px; opacity: .85; }

  .corpo { padding: 10px 14px 12px; }
  .est { padding: 8px 0; border-top: 1px solid var(--borda); }
  .est:first-child { border-top: 0; }
  .est .cab { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--fraco); margin-bottom: 6px; }
  .est .cab b { color: var(--texto); font-weight: 600; }
  .vals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .val { border-radius: 10px; padding: 8px 6px; text-align: center; border: 1px solid var(--borda); }
  .val .n { font-size: 22px; font-weight: 700; line-height: 1.1; }
  .val .n span { font-size: 12px; font-weight: 500; opacity: .8; }
  .val .l { font-size: 11px; color: var(--fraco); margin-top: 2px; }
  .val.bom { background: var(--bom-f); border-color: var(--bom); }
  .val.atencao { background: var(--atencao-f); border-color: var(--atencao); }
  .val.ruim { background: var(--ruim-f); border-color: var(--ruim); }
  .val.sem_dado { background: var(--sem-f); }
  .motivos { margin: 8px 0 0; padding: 0; list-style: none; font-size: 13px; color: var(--fraco); }
  .motivos li::before { content: "•"; margin-right: 6px; }
  .motivos li.ruim { color: #ff9a94; } .motivos li.atencao { color: #ffd98a; }
  .zeus { font-size: 13px; color: var(--fraco); margin-top: 8px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--sem); flex: 0 0 auto; }
  .dot.bom { background: var(--bom); } .dot.atencao { background: var(--atencao); } .dot.ruim { background: var(--ruim); }

  .comp { font-size: 13px; color: var(--fraco); line-height: 1.5; }
  .comp .t { color: var(--texto); }
  .comp b { color: var(--texto); font-weight: 600; }
  table.cmp { border-collapse: collapse; width: 100%; margin: 6px 0; font-variant-numeric: tabular-nums; }
  table.cmp th { text-align: left; font-weight: 500; color: var(--fraco); font-size: 11px; padding: 2px 6px 2px 0; }
  table.cmp td { padding: 3px 6px 3px 0; color: var(--texto); border-top: 1px solid var(--borda); white-space: nowrap; }
  table.cmp td:first-child { color: var(--fraco); }
  table.cmp .fx { color: var(--fraco); font-size: 11px; white-space: normal; }
  .r24 { margin-top: 4px; }
  .dif { font-variant-numeric: tabular-nums; }
  .dif.atencao { color: #ffd98a; } .dif.ruim { color: #ff9a94; }
  .compactas { border-top: 1px solid var(--borda); padding-top: 8px; margin-top: 4px; }
  .compactas .tit { font-size: 12px; color: var(--fraco); margin-bottom: 6px; }
  .linha { display: flex; align-items: center; gap: 8px; font-size: 14px; padding: 4px 0; }
  .linha .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .linha .v { color: var(--fraco); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .linha .v b { color: var(--texto); font-weight: 600; }
  .linha .v.ruim b { color: #ff9a94; } .linha .v.atencao b { color: #ffd98a; }

  .prev { padding: 8px 14px 12px; border-top: 1px solid var(--borda); }
  .prev .tit { font-size: 13px; color: var(--fraco); display: flex; justify-content: space-between; margin-bottom: 8px; }
  .prev .tit b { color: var(--texto); }
  .janela { font-size: 14px; margin-bottom: 8px; }
  .janela b { font-weight: 700; }
  .barra { display: flex; gap: 3px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .barra::-webkit-scrollbar { display: none; }
  .h { flex: 0 0 52px; border-radius: 8px; padding: 6px 2px; text-align: center; font-size: 11px; line-height: 1.25; border: 1px solid var(--borda); }
  .h .hh { font-weight: 700; font-size: 12px; }
  .h.bom { background: var(--bom-f); border-color: var(--bom); }
  .h.atencao { background: var(--atencao-f); border-color: var(--atencao); }
  .h.ruim { background: var(--ruim-f); border-color: var(--ruim); }
  .h.sem_dado { background: var(--sem-f); }
  .h .d { color: var(--fraco); }
  .h.z { flex: 0 0 72px; }
  .rodape { color: var(--fraco); font-size: 12px; text-align: center; margin: 16px 0 4px; line-height: 1.5; }
  button.at { background: var(--cartao); color: var(--texto); border: 1px solid var(--borda); border-radius: 999px; padding: 6px 12px; font-size: 13px; }
  button.at:active { background: var(--borda); }
  .vazio { color: var(--fraco); font-size: 14px; padding: 12px 14px; }
  @media (max-width: 380px) { .vals { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<header>
  <h1>Clima de Aplicação</h1>
  <div class="hora" id="hora">carregando…</div>
</header>
<div class="resumo" id="resumo"></div>
<div id="avisos"></div>
<div id="lista"><div class="vazio">Buscando estações…</div></div>
<div class="rodape" id="rodape"></div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var LIM = null;

  function fmt(v, casas) {
    if (v === null || v === undefined || isNaN(v)) return '–';
    return Number(v).toFixed(casas === undefined ? 0 : casas).replace('.', ',');
  }
  function rosa(g) {
    if (g === null || g === undefined) return '';
    var p = ['N','NE','L','SE','S','SO','O','NO'];
    return p[Math.round((g % 360) / 45) % 8];
  }
  function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"]/g, function (c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function horaBR(iso) {
    if (!iso) return '';
    var d = new Date(iso); if (isNaN(d)) return iso;
    return d.toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'});
  }
  function itemPor(aval, nome) {
    if (!aval || !aval.itens) return null;
    for (var i = 0; i < aval.itens.length; i++) if (aval.itens[i].nome === nome) return aval.itens[i];
    return null;
  }
  function cls(it) { return it ? it.status : 'sem_dado'; }
  var NIVEL = {bom: 'VERDE', atencao: 'AMARELO', ruim: 'VERMELHO', sem_dado: '–'};

  function valor(nome, n, unidade, rotulo, aval) {
    var it = itemPor(aval, nome);
    return '<div class="val ' + cls(it) + '"><div class="n">' + n + ' <span>' + unidade + '</span></div><div class="l">' + rotulo + '</div></div>';
  }

  function quando(s) {
    if (!s.hora_local) return 'sem leitura';
    var t = 'leitura das ' + esc(s.hora_local);
    if (s.idade_min !== null && s.idade_min !== undefined) t += ' · há ' + s.idade_min + ' min';
    return t;
  }

  function estacaoCompleta(s) {
    var l = s.leitura || {}, a = s.avaliacao || {itens: []};
    var com = s.comunicacao && s.comunicacao !== 'OK' ? ' · <span style="color:#ffd98a">' + esc(s.comunicacao.toLowerCase()) + '</span>' : '';
    var cab = '<div class="cab"><span>Estação <b>' + esc(s.nome) + '</b>' + com + '</span><span>' + quando(s) + '</span></div>';
    var vals = '<div class="vals">' +
      valor('Temperatura', fmt(l.temperatura, 1), '°C', 'temperatura', a) +
      valor('Vento', fmt(l.vento, 1), 'km/h', 'vento ' + rosa(l.direcao) + (l.vento_inst != null ? ' · inst ' + fmt(l.vento_inst, 0) : ''), a) +
      valor('Umidade', fmt(l.umidade, 0), '%', 'umidade', a) +
      valor('Delta T', fmt(a.delta_t, 1), '°C', 'delta T' + (l.rajada != null ? ' · raj ' + fmt(l.rajada, 0) : ''), a) +
      '</div>';
    var inet = '';
    var mot = '';
    (a.itens || []).forEach(function (it) {
      if (it.status === 'bom') return;
      mot += '<li class="' + it.status + '">' + esc(it.nome) + ': ' + esc(it.motivo) + '</li>';
    });
    if (s.leitura_antiga) mot += '<li class="ruim">Leitura antiga demais para decidir (estação parada?)</li>';
    if (l.emprestado_de) mot += '<li>Temperatura e umidade da estação vizinha ' + esc(l.emprestado_de) + ' (esta só mede vento)</li>';
    var z = '';
    if (s.parecer_zeus) {
      var pz = s.parecer_zeus;
      z = '<div class="zeus"><span class="dot ' + pz.status + '"></span>Parecer da Zeus' + (pz.hora_local ? ' (' + esc(pz.hora_local) + ')' : '') +
        ': <b>' + NIVEL[pz.status] + '</b>' + (pz.causas && pz.causas.length ? ' por ' + esc(pz.causas.join(', ')) : '') + '</div>';
    }
    return '<div class="est">' + cab + vals + inet + (mot ? '<ul class="motivos">' + mot + '</ul>' : '') + z + '</div>';
  }

  // Diferenca internet - estacao, com sinal: "(+1,2)" / "(−3)"
  function dif(v, un) {
    if (v === null || v === undefined) return '';
    var s = (v > 0 ? '+' : (v < 0 ? '−' : '')) + fmt(Math.abs(v), un === '°' ? 1 : 0) + un;
    var cls = Math.abs(v) >= (un === '°' ? 2 : 5) ? 'ruim' : (Math.abs(v) >= (un === '°' ? 1 : 3) ? 'atencao' : '');
    return '<span class="dif ' + cls + '">(' + s + ')</span>';
  }

  // Previsao da area da fazenda x estacoes da fazenda, no ultimo quadro Zeus
  function comparacao(f) {
    var c = f.comparacao;
    if (!c || !c.previsao) return '';
    var p = c.previsao, e = c.estacoes || {}, d = c.dif || {};
    function linha(nome, un, casas, prev, est, df) {
      if (prev === null || prev === undefined) return '';
      var faixa = est ? fmt(est.med, casas) + un + (est.n > 1 ? ' <span class="fx">(' + fmt(est.min, casas) + ' a ' + fmt(est.max, casas) + ', ' + est.n + ' est.)</span>' : '') : '–';
      return '<tr><td>' + nome + '</td><td>' + fmt(prev, casas) + un + '</td><td>' + faixa + '</td><td>' + dif(df, un === ' °C' ? '°' : '') + '</td></tr>';
    }
    var html = '<div class="comp"><div class="t">Previsão da área × estações, quadro das ' + esc(c.hora_local) + '</div>' +
      '<table class="cmp"><tr><th></th><th>previsão</th><th>estações (média)</th><th>dif.</th></tr>' +
      linha('temperatura', ' °C', 1, p.temperatura, e.temperatura, d.temperatura) +
      linha('vento', ' km/h', 0, p.vento, e.vento, d.vento) +
      linha('umidade', ' %', 0, p.umidade, e.umidade, d.umidade) + '</table>';
    var r = f.comparacao_24h;
    if (r && r.quadros) {
      function item(nome, un, x) {
        if (!x) return '';
        var v = (x.vies > 0 ? '+' : (x.vies < 0 ? '−' : '')) + fmt(Math.abs(x.vies), 1);
        return '<span><b>' + nome + '</b> erra ' + fmt(x.erro_medio, 1) + un + ' em média (tende a ' + v + un + ', pior ' + fmt(x.maior, 1) + un + ')</span>';
      }
      var partes = [item('temperatura', ' °C', r.temperatura), item('vento', ' km/h', r.vento), item('umidade', ' %', r.umidade)].filter(Boolean);
      if (partes.length) html += '<div class="r24"><span class="t">Últimas 24 h (' + r.quadros + ' quadro' + (r.quadros > 1 ? 's' : '') + '):</span> ' + partes.join(' · ') + '</div>';
    }
    return html + '</div>';
  }

  function estacaoCompacta(s) {
    var l = s.leitura || {}, a = s.avaliacao || {};
    var it = itemPor(a, 'Temperatura'), iu = itemPor(a, 'Umidade');
    var st = s.leitura_antiga ? 'sem_dado' : (a.status === 'sem_dado' ? 'sem_dado' : (cls(it) === 'ruim' || cls(iu) === 'ruim' ? 'ruim' : (cls(it) === 'atencao' || cls(iu) === 'atencao' ? 'atencao' : 'bom')));
    var pz = s.parecer_zeus ? '<span class="dot ' + s.parecer_zeus.status + '" title="parecer Zeus"></span>' : '';
    return '<div class="linha"><span class="dot ' + st + '"></span><span class="nm">' + esc(s.nome) + '</span>' +
      '<span class="v ' + cls(it) + '"><b>' + fmt(l.temperatura, 1) + '</b> °C</span>' +
      '<span class="v ' + cls(iu) + '"><b>' + fmt(l.umidade, 0) + '</b> %</span>' +
      '<span class="v">' + esc(s.hora_local || '–') + '</span>' + pz + '</div>';
  }

  function previsaoZeus(f) {
    var ref = null;
    (f.estacoes || []).forEach(function (s) { if (!ref && s.id === f.referencia_id) ref = s; });
    if (!ref || !ref.previsao_zeus || !ref.previsao_zeus.length) return '';
    var b = '';
    ref.previsao_zeus.forEach(function (w) {
      b += '<div class="h z ' + w.status + '"><div class="hh">' + esc(w.hora_local) + '</div><div class="d">' +
        (w.causas && w.causas.length ? esc(w.causas.join(', ')) : (w.status === 'bom' ? 'ok' : '')) + '</div></div>';
    });
    return '<div class="prev"><div class="tit"><span><b>Parecer da Zeus</b> para as próximas horas (janelas de 3 h, estação ' + esc(ref.nome) + ')</span></div>' +
      '<div class="barra">' + b + '</div></div>';
  }

  function previsao(f) {
    var p = f.previsao;
    if (!p) return '';
    var j = f.proxima_janela, jt;
    if (!j) jt = 'Sem janela boa nas próximas ' + (p.horas.length) + ' h';
    else if (j.agora) jt = 'Janela <b>agora</b> até <b>' + esc(j.fim) + '</b>' + (j.nivel === 'atencao' ? ' (com atenção)' : '');
    else if (j.horas <= 1) jt = 'Próxima janela: só às <b>' + esc(j.inicio) + '</b> (1 h)' + (j.nivel === 'atencao' ? ' (com atenção)' : '');
    else jt = 'Próxima janela: <b>' + esc(j.inicio) + '</b> a <b>' + esc(j.fim) + '</b> (' + j.horas + ' h)' + (j.nivel === 'atencao' ? ' (com atenção)' : '');
    var barra = '';
    p.horas.forEach(function (h) {
      barra += '<div class="h ' + h.status + '"><div class="hh">' + esc(h.hora_local) + '</div>' +
        '<div>' + fmt(h.temperatura, 0) + '°</div><div>' + fmt(h.vento, 0) + ' km/h</div><div>' + fmt(h.umidade, 0) + '%</div>' +
        (h.chuva_prob != null && h.chuva_prob >= 30 ? '<div class="d">☂ ' + h.chuva_prob + '%</div>' : '') + '</div>';
    });
    var at = p.atual || {};
    var atTxt = f.fonte === 'previsao' && at.temperatura != null
      ? ' · agora pelo modelo: ' + fmt(at.temperatura, 0) + '°, ' + fmt(at.vento, 0) + ' km/h, ' + fmt(at.umidade, 0) + '%' : '';
    return '<div class="prev"><div class="tit"><span><b>Próximas horas</b> (previsão ' + esc(p.fonte) + ')' + atTxt + '</span></div>' +
      '<div class="janela">' + jt + '</div><div class="barra">' + barra + '</div></div>';
  }

  function fazenda(f) {
    var nVento = (f.estacoes || []).filter(function (s) { return s.tem_vento; }).length;
    var sub = f.fonte === 'estacao' ? (nVento > 1 ? 'pior estação: ' : 'pela estação ') + esc(f.referencia || '') + (f.sem_vento ? ' (sem sensor de vento)' : '')
      : f.fonte === 'previsao' ? 'sem estação: só previsão' : (f.estacoes && f.estacoes.length ? 'estações sem leitura recente' : 'sem estação nem previsão');
    var html = '<div class="faz"><div class="faixa ' + f.status + '"><div class="nome">' + esc(f.nome) + '</div>' +
      '<div class="rotulo">' + esc(f.rotulo) + '<small>' + sub + '</small></div></div>';
    var completas = (f.estacoes || []).filter(function (s) { return s.tem_vento; });
    var compactas = (f.estacoes || []).filter(function (s) { return !s.tem_vento; });
    if (completas.length || compactas.length) {
      html += '<div class="corpo">' + completas.map(estacaoCompleta).join('');
      if (compactas.length) {
        html += '<div class="compactas"><div class="tit">' + compactas.length + ' estação(ões) só de temperatura e umidade</div>' +
          compactas.map(estacaoCompacta).join('') + '</div>';
      }
      html += '</div>';
    }
    var comp = comparacao(f);
    if (comp) html += '<div class="prev">' + comp + '</div>';
    html += previsaoZeus(f);
    html += previsao(f);
    return html + '</div>';
  }

  function render(d) {
    LIM = d.limites || {};
    $('hora').innerHTML = 'atualizado <b>' + horaBR(d.atualizado_em) + '</b>' + (d.simulado ? ' · <b style="color:#ffd98a">SIMULADO</b>' : '') +
      '<br><button class="at" id="btAt">' + (ESTATICO ? 'recarregar' : 'atualizar agora') + '</button>';
    $('btAt').onclick = function () { carregar(true); };
    var r = d.resumo || {};
    $('resumo').innerHTML =
      '<span class="pill" style="border-color:var(--bom)"><b>' + (r.bom || 0) + '</b> bom</span>' +
      '<span class="pill" style="border-color:var(--atencao)"><b>' + (r.atencao || 0) + '</b> atenção</span>' +
      '<span class="pill" style="border-color:var(--ruim)"><b>' + (r.ruim || 0) + '</b> ruim</span>' +
      '<span class="pill"><b>' + (r.sem_dado || 0) + '</b> sem dado</span>' +
      (d.total_estacoes ? '<span class="pill"><b>' + d.total_estacoes + '</b> estações</span>' : '');
    var av = '';
    (d.avisos || []).forEach(function (a) { av += '<div class="aviso">' + esc(a) + '</div>'; });
    $('avisos').innerHTML = av;
    var fz = d.fazendas || [];
    $('lista').innerHTML = fz.length ? fz.map(fazenda).join('') : '<div class="vazio">Nenhuma fazenda configurada.</div>';
    $('rodape').innerHTML = 'Critério: temperatura até ' + fmt(LIM.temperatura_max) + ' °C · vento de ' + fmt(LIM.vento_min) + ' a ' +
      fmt(LIM.vento_max) + ' km/h · umidade acima de ' + fmt(LIM.umidade_min) + ' %.<br>' +
      'Estações Zeus Agrotech fecham um quadro por hora (vento = média da hora, inst = último instante). Previsão: Open-Meteo. Delta T calculado (Stull 2011).<br>' +
      'Leitura de estação manda; a previsão só orienta. A decisão final é do piloto.';
  }

  // Senha da pagina: no link publico (Firebase) vai no cabecalho X-Senha e fica
  // guardada neste aparelho; no notebook o servidor tambem aceita o cabecalho.
  function senhaGuardada() { try { return localStorage.getItem('clima_senha') || ''; } catch (e) { return ''; } }
  function guardarSenha(s) { try { localStorage.setItem('clima_senha', s); } catch (e) {} }
  function pedirSenha(erro) {
    $('lista').innerHTML = '<div class="faz"><div class="corpo"><div style="font-size:15px;margin-bottom:8px">Senha da página</div>' +
      (erro ? '<div class="aviso erro" style="margin-bottom:8px">' + esc(erro) + '</div>' : '') +
      '<input id="inSenha" type="password" placeholder="senha" autocomplete="current-password" style="width:100%;padding:12px;font-size:18px;box-sizing:border-box;border-radius:8px;border:1px solid var(--borda);background:var(--fundo);color:var(--texto)">' +
      '<button id="btSenha" class="at" style="width:100%;margin-top:10px;padding:12px;font-size:16px">Entrar</button></div></div>';
    $('hora').textContent = '';
    var enviar = function () { guardarSenha($('inSenha').value); carregar(false); };
    $('btSenha').onclick = enviar;
    $('inSenha').onkeydown = function (e) { if (e.key === 'Enter') enviar(); };
    $('inSenha').focus();
  }

  // Modo estatico (GitHub Pages): nao ha servidor. O robo publica estado.enc cifrado
  // com a senha da pagina; aqui a gente decifra no navegador (WebCrypto), com os
  // mesmos parametros de nuvem/cifra.py: PBKDF2-SHA256 200000 it., AES-256-GCM.
  var ESTATICO = /\.github\.io$/.test(location.hostname) || location.protocol === 'file:' ||
                 (document.currentScript && document.currentScript.dataset && document.currentScript.dataset.estatico === '1');
  function b64(s) { var bin = atob(s), a = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }
  function decifrar(arquivo, senha) {
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(senha), 'PBKDF2', false, ['deriveKey'])
      .then(function (k) {
        return crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(arquivo.salt), iterations: 200000, hash: 'SHA-256'},
          k, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
      })
      .then(function (chave) { return crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(arquivo.iv)}, chave, b64(arquivo.ct)); })
      .then(function (buf) { return JSON.parse(new TextDecoder().decode(buf)); });
  }
  window.decifrarEstado = decifrar; // exposto para teste

  var ocupado = false;
  function carregarEstatico() {
    // Primeiro tenta os dados abertos (estado.json); se nao existirem, os cifrados (estado.enc + senha).
    fetch('estado.json?t=' + Date.now(), {cache: 'no-store'})
      .then(function (r) {
        if (r.ok) return r.json().then(render);
        var s = senhaGuardada();
        if (!s) { pedirSenha(''); return; }
        return fetch('estado.enc?t=' + Date.now(), {cache: 'no-store'})
          .then(function (r2) { if (!r2.ok) throw new Error('estado.enc ' + r2.status); return r2.json(); })
          .then(function (arq) { return decifrar(arq, s).then(render, function () { pedirSenha('Senha errada'); }); });
      })
      .catch(function (e) { $('avisos').innerHTML = '<div class="aviso erro">Sem dados publicados ainda: ' + esc(e.message) + '</div>'; })
      .then(function () { ocupado = false; });
  }
  function carregar(forcar) {
    if (ocupado) return; ocupado = true;
    if (ESTATICO) return carregarEstatico();
    var cab = {};
    var s = senhaGuardada();
    if (s) cab['X-Senha'] = s;
    fetch(forcar ? '/api/atualizar' : '/api/estado', {cache: 'no-store', headers: cab})
      .then(function (r) {
        if (r.status === 401) { pedirSenha(s ? 'Senha errada' : ''); throw new Error('senha'); }
        return r.json();
      })
      .then(function (d) { if (d.erro) throw new Error(d.erro); render(d); })
      .catch(function (e) { if (e.message !== 'senha') $('avisos').innerHTML = '<div class="aviso erro">Sem resposta do servidor: ' + esc(e.message) + '</div>'; })
      .then(function () { ocupado = false; });
  }
  carregar(false);
  setInterval(function () { carregar(false); }, 60000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) carregar(false); });
})();
</script>
