name: Zeus → MariAgro

# Robô à parte do "Atualizar clima": lê as estações direto da API da Zeus e grava em
# grupos/corvino-fazendas/zeus no banco do MariAgro (nuvem/mariagro_zeus.py). Não publica
# nada neste repositório nem mexe no site.
#
# Mora aqui porque este repositório é público (minutos de Actions ilimitados). No
# repositório privado mariagro o mesmo laço gastou a cota de 2.000 min/mês em 2 dias
# (09 a 11/11/2026).
#
# O cron do GitHub é pouco confiável, então cada execução fica viva ~6 h gravando a cada
# 10 min e o cron só serve para REINICIAR o laço; a cada 2 h uma execução nova entra na
# fila (concurrency) e assume quando a anterior termina.
#
# Medido em 11 a 13/11/2026: o cron disparou só 3 a 4 vezes por dia (não 12), e entre o
# fim de uma execução e o disparo seguinte ficavam buracos de 1 a 4 h sem dado novo.
# Por isso a última etapa ("Chamar a próxima execução") dispara a execução seguinte
# assim que o laço termina. Ela só chama se a execução rodou pelo menos 50 min (falha
# rápida não vira laço de falhas) e se não houver outra já esperando na fila. O cron
# continua valendo como segunda garantia.
on:
  schedule:
    - cron: "37 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # para a última etapa chamar a próxima execução

concurrency:
  group: mariagro-zeus
  cancel-in-progress: false

jobs:
  zeus:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - name: Hora de início
        run: echo "INICIO=$(date +%s)" >> "$GITHUB_ENV"

      - name: Código
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Laço de 350 min lendo a Zeus e gravando no banco do MariAgro
        env:
          ZEUS_EMAIL: ${{ secrets.ZEUS_EMAIL }}
          ZEUS_SENHA: ${{ secrets.ZEUS_SENHA }}
        run: python nuvem/mariagro_zeus.py --laco 350 --intervalo 10

      - name: Chamar a próxima execução
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          decorrido=$(( $(date +%s) - INICIO ))
          if [ "$decorrido" -lt 3000 ]; then echo "rodou só ${decorrido}s; não chamo a próxima"; exit 0; fi
          fila=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow mariagro-zeus.yml --limit 20 --json status --jq '[.[] | select(.status=="queued" or .status=="pending" or .status=="waiting" or .status=="requested")] | length')
          if [ "$fila" != "0" ]; then echo "já há $fila execução esperando na fila; ela assume"; exit 0; fi
          gh workflow run mariagro-zeus.yml --repo "$GITHUB_REPOSITORY" --ref main
