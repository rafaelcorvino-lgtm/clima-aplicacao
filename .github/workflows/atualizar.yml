name: Atualizar clima

# A Zeus fecha um quadro por hora (chega por volta de hh:02). O GitHub costuma
# atrasar a disparada agendada alguns minutos, por isso: varias disparadas por
# hora, e o robo (--esperar-quadro) fica tentando a cada minuto nos primeiros
# 25 min ate o quadro novo aparecer. As demais disparadas renovam a previsao.
#
# Obs.: o GitHub so agenda workflows do ramo padrao (main). Se o agendamento
# parar de disparar, um push neste arquivo no main reregistra o cron.
on:
  schedule:
    - cron: "2,6,11,17,30,45 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-clima
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Código
        uses: actions/checkout@v4

      - name: Site publicado (ramo gh-pages)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências
        run: pip install --quiet cryptography

      - name: Buscar Zeus e previsão, cifrar e montar o site
        env:
          ZEUS_EMAIL: ${{ secrets.ZEUS_EMAIL }}
          ZEUS_SENHA: ${{ secrets.ZEUS_SENHA }}
          APP_SENHA: ${{ secrets.APP_SENHA }}
        run: python nuvem/atualizar.py --saida site --esperar-quadro

      - name: Publicar
        run: |
          cd site
          git config user.name "clima-robo"
          git config user.email "clima-robo@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nada mudou"
          else
            git commit -q -m "atualiza $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
