name: Atualizar clima

# O agendamento (cron) do GitHub e pouco confiavel: medido em 23 a 25/10/2026,
# disparou ~7 vezes por dia em vez das 144 pedidas. Entao cada execucao fica
# viva por quase 6 h (o maximo de um job) publicando a cada 10 min
# (nuvem/atualizar.py --laco), e o cron so serve para REINICIAR o laco.
# A cada 2 h uma execucao nova entra na fila (concurrency) e assume quando a
# anterior termina: mesmo com horas de atraso no cron, nao abre buraco.
#
# Obs.: o GitHub so agenda workflows do ramo padrao (main). Se o agendamento
# parar de disparar, um push neste arquivo no main reregistra o cron.
#
# Medido em 11 a 13/11/2026: o cron disparou só 3 a 4 vezes por dia (não 12), e entre o
# fim de uma execução e o disparo seguinte ficavam buracos de 1 a 4 h sem dado novo.
# Por isso a última etapa ("Chamar a próxima execução") dispara a execução seguinte
# assim que o laço termina. Ela só chama se a execução rodou pelo menos 50 min (falha
# rápida não vira laço de falhas) e se não houver outra já esperando na fila. O cron
# continua valendo como segunda garantia.
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # para a última etapa chamar a próxima execução

concurrency:
  group: atualizar-clima
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - name: Hora de início
        run: echo "INICIO=$(date +%s)" >> "$GITHUB_ENV"

      - name: Código
        uses: actions/checkout@v4

      - name: Site publicado (ramo gh-pages)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências
        run: pip install --quiet cryptography

      - name: Identidade do robô no git
        run: |
          cd site
          git config user.name "clima-robo"
          git config user.email "clima-robo@users.noreply.github.com"

      - name: Laço de 350 min buscando Zeus e previsão, cifrando e publicando
        env:
          ZEUS_EMAIL: ${{ secrets.ZEUS_EMAIL }}
          ZEUS_SENHA: ${{ secrets.ZEUS_SENHA }}
          APP_SENHA: ${{ secrets.APP_SENHA }}
          # "1" = pagina aberta, sem senha (decisao do Rafael em 28/10/2026).
          # Para voltar a pedir senha: troque para "0" e de push.
          CLIMA_ABERTO: "1"
        run: python nuvem/atualizar.py --saida site --laco 350 --push

      - name: Publicar o que sobrou (segurança)
        if: always()
        run: |
          cd site
          git add -A
          if git diff --cached --quiet; then echo "nada pendente"; else
            git commit -q -m "atualiza $(date -u +'%Y-%m-%d %H:%M') UTC (final)"
            git pull --rebase -q || true
            git push -q
          fi

      - name: Chamar a próxima execução
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          decorrido=$(( $(date +%s) - INICIO ))
          if [ "$decorrido" -lt 3000 ]; then echo "rodou só ${decorrido}s; não chamo a próxima"; exit 0; fi
          fila=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow atualizar.yml --limit 20 --json status --jq '[.[] | select(.status=="queued" or .status=="pending" or .status=="waiting" or .status=="requested")] | length')
          if [ "$fila" != "0" ]; then echo "já há $fila execução esperando na fila; ela assume"; exit 0; fi
          gh workflow run atualizar.yml --repo "$GITHUB_REPOSITORY" --ref main
